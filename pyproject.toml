[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[tool.isort]
line_length = 100

[project]
name = "audio-controlnet"
version = "1.0.0"
authors = [{ name = "Haina Zhu", email = "juhayna@qq.com" }]
description = "Audio ControlNet for Fine-Grained Audio Generation and Editing."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'torch >= 2.5.1',
  'huggingface_hub >= 0.26,<= 0.36',
  'cython',
  'gitpython >= 3.1',
  'tensorboard >= 2.11',
  'numpy >= 1.21, <2.1',
  'Pillow >= 9.5',
  'opencv-python >= 4.8',
  'scipy >= 1.7,<= 1.14',
  'tqdm',
  'gradio >= 3.34,<= 4.43',
  'einops >= 0.6',
  'hydra-core >= 1.3.2',
  'requests',
  'torchdiffeq >= 0.2.5',
  'librosa >= 0.8.1',
  'nitrous-ema',
  'hydra_colorlog',
  'tensordict >= 0.6.1',
  'colorlog',
  'open_clip_torch >= 2.29.0',
  'av >= 14.0.1',
  'timm >= 1.0.12',
  'python-dotenv',
  'transformers >= 4.57.0, < 5.0.0',
  'debugpy',
  'torchaudio',
  'laion-clap >= 1.1.7',
  'json5'
]

[tool.hatch.build.targets.wheel]
packages = ["audio_controlnet"]
